<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md overflow-hidden">

<a class="font-body-md text-body-md text-primary flex items-center gap-2 w-fit touch-target-min" href="tel:+918433927633">

                    </a>
<a class="font-body-md text-body-md text-primary flex items-center gap-2 w-fit touch-target-min" href="tel:1800890PARTH">
<span class="material-symbols-outlined text-[20px]">call</span> 1800-890-PARTH
                    </a>

<!-- Help Center Chips -->

<script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const typingIndicator = document.getElementById('typing-indicator');

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'max-w-[85%] self-end bg-primary-container text-on-primary-container font-body-md text-body-md p-3 rounded-2xl rounded-tr-sm shadow-sm';
            msgDiv.textContent = text;
            chatContainer.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        function addAgentMessage(text) {
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'flex gap-2 max-w-[85%] self-start';
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'w-8 h-8 rounded-full bg-primary-container flex items-center justify-center shrink-0 mt-1';
            avatarDiv.innerHTML = '<span class="material-symbols-outlined text-on-primary-container text-[18px]">support_agent</span>';
            
            const msgContentDiv = document.createElement('div');
            msgContentDiv.className = 'bg-surface-container-high text-on-surface font-body-md text-body-md p-3 rounded-2xl rounded-tl-sm shadow-sm';
            msgContentDiv.textContent = text;

            wrapperDiv.appendChild(avatarDiv);
            wrapperDiv.appendChild(msgContentDiv);
            
            chatContainer.insertBefore(wrapperDiv, typingIndicator);
            scrollToBottom();
        }

        function simulateAgentReply(userText) {
            typingIndicator.classList.remove('hidden');
            typingIndicator.classList.add('flex');
            scrollToBottom();

            setTimeout(() => {
                typingIndicator.classList.add('hidden');
                typingIndicator.classList.remove('flex');
                
                let reply = "I'm checking that for you.";
                if (userText.includes("post a job")) {
                    reply = "To post a job, go to the 'Jobs' tab in your profile and click the 'Create New' button. You'll need to fill in the job details and location.";
                } else if (userText.includes("money to wallet")) {
                    reply = "You can add money to your wallet by navigating to the 'Wallet' tab and selecting 'Add Funds'. We support UPI, cards, and net banking.";
                } else if (userText.includes("Call Parth")) {
                    reply = "You can reach me directly at +91 84339 27633 or our toll-free number 1800-890-PARTH.";
                }

                addAgentMessage(reply);
            }, 1500); // 1.5s typing delay
        }

        function sendQuickReply(text) {
            addUserMessage(text);
            simulateAgentReply(text);
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (text) {
                addUserMessage(text);
                chatInput.value = '';
                simulateAgentReply(text);
            }
        });
    </script>
