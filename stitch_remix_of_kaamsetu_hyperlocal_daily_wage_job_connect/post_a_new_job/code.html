<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post a New Job | KaamSetu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>

      tailwind.config = {

        theme: {
          extend: {

                    "tertiary": "#323e36",

                    "inverse-on-surface": "#f3f0ef",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#dcd9d9",
                    "tertiary-fixed": "#d9e6da",
                    "primary": "#00450d",
                    "surface-container": "#f0eded",
                    "inverse-surface": "#303030",
                    "secondary-fixed": "#ffddb5",
                    "surface": "#fcf9f8",
                    "primary-fixed": "#acf4a4",
                    "surface-tint": "#2a6b2c",
                    "inverse-primary": "#91d78a",
                    "on-primary-fixed-variant": "#0c5216",
                    "on-tertiary-container": "#bcc9be",
                    "tertiary-fixed-dim": "#bdcabe",
                    "on-secondary-fixed": "#2a1800",
                    "on-primary-fixed": "#002203",
                    "surface-container-high": "#eae7e7",
                    "surface-bright": "#fcf9f8",
                    "on-surface-variant": "#41493e",
                    "on-primary-container": "#90d689",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#ffb957",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#694300",
                    "secondary": "#835400",
                    "on-background": "#1b1c1c",
                    "primary-container": "#1b5e20",
                    "surface-container-highest": "#e5e2e1",
                    "on-error": "#ffffff",
                    "tertiary-container": "#49554c",
                    "on-surface": "#1b1c1c",
                    "surface-variant": "#e5e2e1",
                    "on-tertiary-fixed": "#131e17",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#3e4a41",
                    "background": "#fcf9f8",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "unit": "8px",
                    "margin-desktop": "32px",
                    "touch-target-min": "48px",
                    "margin-mobile": "16px",
                    "gutter": "16px",

                    "stack-lg": "24px"
            },
            "fontFamily": {
                    "button-text": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "label-lg": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],

            },
            "fontSize": {
                    "button-text": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

                    "label-lg": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],

                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .chip-active {
            background-color: #00450d;
            color: #ffffff;
            border-color: #00450d;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #00450d !important;
            box-shadow: 0 0 0 1px #00450d;
        }

        .bottom-sheet-gradient {
            background: linear-gradient(to top, rgba(252, 249, 248, 1) 85%, rgba(252, 249, 248, 0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Top AppBar (Back Action - Task Focused Journey) -->
<header class="fixed top-0 w-full z-50 bg-primary flex justify-between items-center px-margin-mobile h-touch-target-min text-on-primary shadow-sm">
<div class="flex items-center gap-4">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-on-primary/10 transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">Post a New Job</h1>
</div>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for symmetry -->
</header>
<!-- Main Content -->
<main class="flex-1 mt-[48px] mb-[80px] overflow-y-auto px-margin-mobile py-stack-lg max-w-2xl mx-auto w-full">
<form class="space-y-stack-lg" id="jobForm">
<!-- Job Title -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="job-title">Job Title</label>
<input class="w-full h-touch-target-min px-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-all" id="job-title" placeholder="e.g. Living Room Painting" type="text"/>
</section>
<!-- Category Selector -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block">Category</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 h-[40px] rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors hover:bg-surface-container-high" onclick="toggleChip(this)" type="button">Painting</button>
<button class="px-4 h-[40px] rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors hover:bg-surface-container-high" onclick="toggleChip(this)" type="button">Plumbing</button>
<button class="px-4 h-[40px] rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors hover:bg-surface-container-high" onclick="toggleChip(this)" type="button">Cleaning</button>
<button class="px-4 h-[40px] rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors hover:bg-surface-container-high" onclick="toggleChip(this)" type="button">Electrical</button>
<button class="px-4 h-[40px] rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors hover:bg-surface-container-high" onclick="toggleChip(this)" type="button">Carpentry</button>
</div>
</section>
<!-- Description -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="description">Description</label>
<textarea class="w-full p-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-all resize-none" id="description" placeholder="Describe the work in detail..." rows="4"></textarea>
</section>
<!-- Date & Time -->
<div class="grid grid-cols-2 gap-gutter">
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="date">Date</label>
<div class="relative">
<input class="w-full h-touch-target-min pl-4 pr-10 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface" id="date" placeholder="Select Date" readonly="" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">calendar_today</span>
</div>
</section>
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="time">Time</label>
<div class="relative">
<input class="w-full h-touch-target-min pl-4 pr-10 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface" id="time" placeholder="Select Time" readonly="" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">schedule</span>
</div>
</section>
</div>
<!-- Location -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="location">Location</label>
<div class="relative">
<input class="w-full h-touch-target-min pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface" id="location" placeholder="Street name, landmark..." type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">location_on</span>
</div>
<button class="text-primary font-label-lg flex items-center gap-1 mt-1 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">my_location</span>
                    Use current location
                </button>
</section>
<!-- Budget -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block">Budget</label>
<div class="flex rounded-xl overflow-hidden border border-outline-variant h-touch-target-min mb-stack-sm">
<button class="flex-1 bg-primary text-on-primary font-label-lg transition-colors" id="fixedBtn" onclick="setBudgetMode('fixed')" type="button">Fixed</button>
<button class="flex-1 bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors border-l border-outline-variant" id="negoBtn" onclick="setBudgetMode('negotiable')" type="button">Negotiable</button>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-label-lg text-on-surface">₹</span>
<input class="w-full h-touch-target-min pl-8 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none" placeholder="Enter amount" type="number"/>
</div>
</section>
<!-- Special Requirements -->
<section class="space-y-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block" for="special">Special Requirements (Optional)</label>
<textarea class="w-full p-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-all resize-none" id="special" placeholder="Any specific tools or materials needed?" rows="3"></textarea>
</section>
<!-- Image/Visual Anchor for Mood -->
<div class="rounded-xl overflow-hidden bg-surface-container h-48 relative flex items-center justify-center">
<div class="absolute inset-0 bg-black/5 z-10"></div>
<div class="w-full h-full bg-cover bg-center" data-alt="A warm, professional photograph of a local skilled worker neatly organizing high-quality painting tools on a clean drop cloth. The lighting is bright and natural, suggesting a reliable and trustworthy home service environment. The scene is shot with a shallow depth of field, highlighting the precision of the tools in a modern, humanist aesthetic with soft green accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCqu311kwA54LtNDRfIFiHsx70C3FitbWdCgdJZD2Ve_jXW-AHJn4YwKQLWHL-vCVxWsfgjXzrLoK-D2_Sk9--US2Kzt2X1FsVugbfrAvWuwkgFxwfLYIUaRu_hKGKuldIiT1C_PyG6yPNnjjFe-QJ7RMZpso1wZvTYwb0ffZcQajES1LxGYB6BpSvKudjfajJVlZmL6qMKGf16MuS7vLvRlLro8YkpX3SDBoCLIn3dMtwx4jBI031AEDgAVbCqvTP2nlGvssNvAKg')"></div>
<div class="absolute bottom-4 left-4 z-20 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full border border-primary/20">
<p class="text-[12px] font-label-lg text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified</span>
                        Verified Professionals only
                    </p>
</div>
</div>
</form>
</main>
<!-- Bottom Sticky Action -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface border-t border-outline-variant z-50 flex flex-col items-center">
<button class="w-full max-w-2xl h-touch-target-min bg-primary text-on-primary font-button-text text-button-text rounded-full shadow-lg active:scale-[0.98] transition-transform duration-100 flex items-center justify-center gap-2" id="submitJob">
            Post Job
            <span class="material-symbols-outlined">send</span>
</button>
</div>
<!-- Script for interactive elements -->
<script>
        function toggleChip(chip) {
            chip.classList.toggle('chip-active');
            chip.classList.toggle('bg-surface-container-lowest');
            chip.classList.toggle('text-on-surface-variant');
        }

        function setBudgetMode(mode) {
            const fixedBtn = document.getElementById('fixedBtn');
            const negoBtn = document.getElementById('negoBtn');
            
            if (mode === 'fixed') {
                fixedBtn.className = "flex-1 bg-primary text-on-primary font-label-lg transition-colors";
                negoBtn.className = "flex-1 bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors border-l border-outline-variant";
            } else {
                negoBtn.className = "flex-1 bg-primary text-on-primary font-label-lg transition-colors border-l border-outline-variant";
                fixedBtn.className = "flex-1 bg-surface-container-lowest text-on-surface-variant font-label-lg transition-colors";
            }
        }

        // Micro-interaction for submit button
        document.getElementById('submitJob').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            btn.innerHTML = 'Posting... <span class="material-symbols-outlined animate-spin">sync</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = 'Success! <span class="material-symbols-outlined">check_circle</span>';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                
                setTimeout(() => {
                    alert("Job Posted Successfully! Skilled workers in your area will be notified.");
                    // Reset or Redirect
                    window.location.reload();
                }, 1000);
            }, 1500);
        });

        // Add visual feedback to inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
