<body class="bg-background text-on-background min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Screen Container -->

<!-- Header / Logo Section -->
<header class="flex flex-col items-center gap-stack-sm mb-stack-lg">
<div class="h-16 w-auto flex items-center justify-center">
<img alt="KaamSetu Logo" class="h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATlyEP3RcY3ArJ8nUk09-HuwxgqWEHY1pg8JU_Xd5hatzR1XDbS-_syfFV7-rUVHuq2rQRAyd6fha0knHCsOkT7TbqaQ-XOKkyFUGWuDKZHt3pEFoAaDHqoQZQssSNVeMU62_dT44wlvuIWzwg_0xOKrkiB61FzPkwe3q9NfR1UKHk2gSzRX58QXS-bmb4OLC__5tFa51wy2V60e1eQsPAO-jKd_Gk-QRoGUXVVObYC0o_cY1kGvqOkcA8EfeS6zdN-s0cby6jkd0"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center">
                कामसेतु - काम का पुल
            </h1>
</header>
<!-- Illustration Section -->
<div class="w-full aspect-square mb-stack-lg overflow-hidden rounded-xl bg-surface-container-low border border-outline-variant/30">
<img alt="Happy Worker Illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8o_lepiLu_Dh0_h-WRxOAWiR7_KtWT3EPmDz_PfqqG8_d1UgL5H1e77XXBMLAmXuUf5kqPPHbgNT0cb1Xm3hObZLfj5UEXsqvz61ndXpdPeYN1OAMBzZgH1wZweGPJo-ChENTaEb_Fl72sbIfH0jbGN0g9gpdYmzH2-hF5nGmmN8bPxmtDc9LeSGFgRXN3ZcmHnxxOcfa_N-XN9L1gTgvl9QlmQbsI_Kok6uaUywBt_4LOdcwb75TSihw4UUCT9XLBhAKbng9MMg"/>
</div>
<!-- Identity / Welcome Text (Optional but enhances accessibility) -->
<div class="mb-stack-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to find work or hire skilled workers.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md flex-grow" id="loginForm">
<!-- Phone Input Cluster -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant px-1" for="phone">Mobile Number</label>
<div class="focus-ring flex items-center bg-surface-container-lowest border-2 border-outline-variant rounded-lg h-touch-target-min px-4 transition-all duration-200">
<div class="flex items-center gap-2 pr-3 border-r border-outline-variant mr-3">
<span class="text-2xl">🇮🇳</span>
<span class="font-body-lg text-body-lg font-semibold text-on-surface">+91</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg p-0 text-on-surface placeholder:text-outline-variant" id="phone" inputmode="numeric" maxlength="10" name="phone" pattern="[0-9]{10}" placeholder="Enter 10 digits" required="" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="mt-stack-sm w-full h-touch-target-min bg-primary text-on-primary rounded-lg font-button-text text-button-text shadow-sm active:scale-95 transition-transform duration-150 flex items-center justify-center" type="submit">
                Send OTP
            </button>
</form>
<!-- Footer / Disclaimer -->
<footer class="mt-auto pt-stack-lg flex flex-col items-center gap-stack-sm">
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">
                By continuing, you agree to our 
                <a class="text-primary font-semibold hover:underline decoration-2" href="#">Terms</a> & 
                <a class="text-primary font-semibold hover:underline decoration-2" href="#">Privacy Policy</a>
</p>
<div class="mt-4 opacity-50 flex items-center gap-2">
<span class="font-label-lg text-label-lg">© 2024 KaamSetu</span>
</div>
</footer>
</main>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const phoneInput = document.getElementById('phone');
            const form = document.getElementById('loginForm');

            // Prevent non-numeric input
            phoneInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            // Form submission handling
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerHTML;
                
                // Visual feedback
                btn.disabled = true;
                btn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                `;

                // Simulate network delay
                setTimeout(() => {
                    alert('OTP has been sent to +91 ' + phoneInput.value);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }, 1500);
            });
        });
    </script>
