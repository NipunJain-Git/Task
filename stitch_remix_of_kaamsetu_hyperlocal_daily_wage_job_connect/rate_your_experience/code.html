            "spacing": {

          },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .rating-btn-active-good {
            background-color: rgba(27, 94, 32, 0.08);
            border-color: #1b5e20 !important;
            box-shadow: inset 0 0 0 1px #1b5e20;
        }

        .rating-btn-active-bad {
            background-color: rgba(186, 26, 26, 0.08);
            border-color: #ba1a1a !important;
            box-shadow: inset 0 0 0 1px #ba1a1a;
        }

        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased transition-colors duration-300">
<!-- TopAppBar -->
<header class="w-full top-0 left-0 bg-background z-50 sticky">
<div class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full max-w-7xl mx-auto">
<button aria-label="Close" class="p-2 -ml-2 rounded-full hover:bg-surface-variant/10 transition-colors duration-200">
<span class="material-symbols-outlined text-primary text-[24px]">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Rate Experience</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="max-w-2xl mx-auto px-margin-mobile py-stack-lg no-scrollbar">
<!-- Completed Job Card -->
<section class="mb-stack-lg">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start gap-4">
<div class="w-12 h-12 bg-primary-fixed rounded-lg flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-on-primary-fixed text-[28px]">format_paint</span>
</div>
<div class="flex-grow">
<h2 class="font-label-lg text-label-lg text-on-surface">House Painting (2 Rooms)</h2>
<p class="text-on-surface-variant text-sm mt-1">Client: <span class="font-semibold">Sharma Family</span></p>
<p class="text-outline text-xs mt-0.5">Completed on Aug 5, 2026</p>
</div>
</div>
</section>
<!-- Main Rating Content -->
<section class="flex flex-col gap-stack-lg items-center text-center">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background px-4">How was your experience?</h3>
<!-- Interaction Buttons -->
<div class="grid grid-cols-2 gap-4 w-full">
<!-- Good Button -->
<button class="flex flex-col items-center justify-center py-6 px-4 border-2 border-primary-container/20 rounded-xl bg-white hover:bg-primary-container/5 transition-all duration-200 group active:scale-95 min-h-[140px]" id="btn-good" onclick="toggleRating('good')">
<span class="material-symbols-outlined text-[48px] text-primary-container mb-2 group-hover:scale-110 transition-transform">thumb_up</span>
<span class="font-button-text text-button-text text-primary-container">Good</span>
</button>
<!-- Not Good Button -->
<button class="flex flex-col items-center justify-center py-6 px-4 border-2 border-error/20 rounded-xl bg-white hover:bg-error/5 transition-all duration-200 group active:scale-95 min-h-[140px]" id="btn-bad" onclick="toggleRating('bad')">
<span class="material-symbols-outlined text-[48px] text-error mb-2 group-hover:scale-110 transition-transform">thumb_down</span>
<span class="font-button-text text-button-text text-error">Not Good</span>
</button>
</div>
<!-- Comment Area -->
<div class="w-full flex flex-col gap-stack-sm text-left">
<label class="font-label-lg text-label-lg text-on-surface-variant px-1" for="comment">Write a comment (optional)</label>
<div class="relative">
<textarea class="w-full min-h-[120px] p-4 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-body-md" id="comment" maxlength="150" oninput="updateCount(this)" placeholder="Share details about your service experience..."></textarea>
<div class="absolute bottom-3 right-4 text-xs text-outline font-medium">
<span id="char-count">0</span> / 150
                    </div>
</div>
</div>
<!-- Illustration / Atmospheric Element (Lightweight micro-interaction placeholder) -->
<div class="py-4 opacity-80">
<div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-tr from-primary-fixed to-secondary-fixed flex items-center justify-center overflow-hidden">
<div class="w-full h-full bg-cover bg-center" data-alt="A warm, professional illustration of a smiling worker and a happy customer shaking hands in a bright, clean apartment. The style is humanist, minimalist, and digital art-focused with soft green and gold accents to match the KaamSetu brand identity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB6yRwXNnsRUHtOK0nWFWM9JfhzeJ1fP91X9TMnMoXn9tlpYdZuuzG9zWEQmaNOrdpluie0N5XQJ-Pli7QSJHZ_NIqEksjFGsksH_kh-O7Np211SVSFPloqBlNfp1i8HGgXbZqdMrwYLyd_4jY1TUIpZStPzNEmw6DIlU6OGUevmfTbltOb_2Z7b84wRKrn4OiHL3H7SGtvY3jzzB8QAInoFIvdURtJNxG7cOYVNcTv-MTCQdSQsAxz9drnLT3bUNSbTRIVdszXZR0')"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-stack-md mt-4">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-button-text text-button-text rounded-full shadow-lg hover:shadow-xl active:scale-95 transition-all duration-150 flex items-center justify-center">
                    Submit Rating
                </button>
<button class="font-label-lg text-label-lg text-primary hover:underline transition-all underline-offset-4 py-2">
                    Skip
                </button>
</div>
</section>
</main>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-2xl transform translate-y-32 opacity-0 transition-all duration-500 z-[100] flex items-center gap-2" id="toast">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="font-label-lg">Rating submitted! Thank you.</span>
</div>
<script>
        function toggleRating(type) {
            const goodBtn = document.getElementById('btn-good');
            const badBtn = document.getElementById('btn-bad');
            
            if (type === 'good') {
                goodBtn.classList.add('rating-btn-active-good');
                badBtn.classList.remove('rating-btn-active-bad');
            } else {
                badBtn.classList.add('rating-btn-active-bad');
                goodBtn.classList.remove('rating-btn-active-good');
            }

            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function updateCount(textarea) {
            const count = document.getElementById('char-count');
            count.innerText = textarea.value.length;
            
            if (textarea.value.length >= 150) {
                count.classList.add('text-error');
            } else {
                count.classList.remove('text-error');
            }
        }

        // Logic to show toast on Submit (Simple trigger simulation)
        document.querySelector('button.bg-primary').addEventListener('click', () => {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        });
    </script>
</body></html>
