<body class="bg-surface text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- Top Navigation Shell (Limited for Role Selection Focus) -->
<header class="bg-surface sticky top-0 z-50 flex items-center justify-between px-margin-mobile w-full h-touch-target-min">
<div class="font-headline-md text-headline-md font-bold text-primary">KaamSetu</div>
<button class="material-symbols-outlined text-primary p-2 active:scale-95 transition-transform" data-icon="help_outline">help_outline</button>
</header>
<main class="max-w-[600px] mx-auto px-margin-mobile pt-stack-lg pb-32 flex flex-col min-h-screen">
<!-- Header Section -->
<section class="mb-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-stack-sm">
                I want to
            </h1>
<p class="text-on-surface-variant font-body-lg text-body-lg">Select how you want to use KaamSetu today.</p>
</section>
<!-- Role Selection Cards -->
<div class="flex flex-col gap-stack-md flex-grow">
<!-- Worker Role -->
<label class="group relative block cursor-pointer transition-all active:scale-[0.98]">
<input class="radio-hidden peer" name="role" onchange="updateSelection(this)" type="radio" value="worker"/>
<div class="flex flex-col p-stack-lg border-2 border-primary-container bg-surface rounded-xl transition-all peer-checked:role-card-active hover:bg-surface-container-low h-full min-h-[160px] justify-center">
<div class="flex items-start gap-stack-md">
<div class="bg-primary-container text-white p-3 rounded-lg flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[32px]" data-icon="engineering">engineering</span>
</div>
<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-primary mb-1">Find Work</h2>
<p class="text-on-surface-variant font-body-md text-body-md leading-snug">
                                I am a skilled worker looking for daily jobs nearby
                            </p>
</div>
</div>
<div class="absolute right-stack-md top-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Employer Role -->
<label class="group relative block cursor-pointer transition-all active:scale-[0.98]">
<input class="radio-hidden peer" name="role" onchange="updateSelection(this)" type="radio" value="employer"/>
<div class="flex flex-col p-stack-lg border-2 border-primary-container bg-surface rounded-xl transition-all peer-checked:role-card-active hover:bg-surface-container-low h-full min-h-[160px] justify-center">
<div class="flex items-start gap-stack-md">
<div class="bg-primary-container text-white p-3 rounded-lg flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[32px]" data-icon="home">home</span>
</div>
<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-primary mb-1">Hire Help</h2>
<p class="text-on-surface-variant font-body-md text-body-md leading-snug">
                                I need to hire workers for tasks at my home
                            </p>
</div>
</div>
<div class="absolute right-stack-md top-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>

                </p>

<a class="text-on-surface-variant text-label-lg underline opacity-80 hover:opacity-100" href="#">Terms of Service</a>

</div>
</footer>

<script>
        function updateSelection(radio) {
            const btn = document.getElementById('continueBtn');
            if (radio.checked) {
                btn.disabled = false;
                // Add a small haptic-like animation to the button
                btn.classList.add('scale-105');
                setTimeout(() => btn.classList.remove('scale-105'), 200);
            }
        }

        // Handle button click
        document.getElementById('continueBtn').addEventListener('click', () => {
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            console.log('Navigating to', selectedRole, 'onboarding flow...');
            
            // Visual feedback
            const btn = document.getElementById('continueBtn');
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>`;
            
            setTimeout(() => {
                alert('Role selected: ' + selectedRole + '. Proceeding to authentication...');
                btn.innerText = 'Continue';
            }, 800);
        });
    </script>
